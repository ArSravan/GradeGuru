<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GradeGuru — Home</title>

  <style>
    :root{
      --bg1:#0ea5e9;
      --bg2:#8b5cf6;
      --card: rgba(255,255,255,.10);
      --card2: rgba(255,255,255,.16);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.72);
      --line: rgba(255,255,255,.18);
      --shadow: 0 24px 60px rgba(0,0,0,.28);
      --radius: 18px;
    }

    *{
      box-sizing: border-box;
      margin: 0;
    }

    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: 
        radial-gradient(1200px 700px at 10% 10%, rgba(255,255,255,.22), transparent 55%), 
        radial-gradient(900px 600px at 90% 20%, rgba(255,255,255,.18), transparent 60%), 
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center; /* Vertically center */
      justify-content: center; /* Horizontally center */
      min-height: 100vh;
      padding: 0 16px;
      overflow-x: hidden;
    }

    .wrap{
      width: 100%;
      max-width: 980px;  /* max width for large screens */
      display: flex;
      justify-content: center; /* Centering inside flex */
      align-items: center;
      padding: 16px;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      overflow: hidden;
      padding: 20px;
      width: 100%; /* full width of wrap */
      max-width: 500px; /* max width for the card */
    }

    .cardHeader{
      padding: 20px 20px 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(to right, rgba(255,255,255,.10), rgba(255,255,255,.04));
    }

    .cardHeader h1{
      margin: 0;
      font-size: clamp(26px, 3vw, 38px);
      letter-spacing: .2px;
    }

    .cardHeader p{
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.4;
      max-width: 60ch;
      font-size: 13.5px;
    }

    .cardBody{
      padding: 20px;
    }

    .badgeRow{
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 8px 0 18px;
      justify-content: center; /* Center badges */
    }

    .badge{
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.12);
      color: var(--text);
      font-weight: 800;
      letter-spacing:.2px;
      font-size: 12px;
    }

    .dot{
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,.85);
      box-shadow: 0 0 0 4px rgba(255,255,255,.10);
    }

    .ctaRow{
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 14px;
      justify-content: center; /* Center the CTA buttons */
    }

    .btn{
      border: 0;
      cursor: pointer;
      border-radius: 14px;
      padding: 12px 14px;
      font-weight: 800;
      letter-spacing: .2px;
      color: #0b1020;
      background: rgba(255,255,255,.92);
      transition: transform .06s ease, filter .2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn:hover{ 
      filter: brightness(1.05); 
    }

    .btn:active{ 
      transform: translateY(1px); 
    }

    .btnGhost{
      background: rgba(0,0,0,.18);
      color: var(--text);
      border: 1px solid var(--line);
      font-weight: 800;
    }

    .mini{
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      margin-top: 12px;
    }

    a.link{
      color: rgba(255,255,255,.92);
      text-decoration: underline;
    }

  </style>
</head>

<body>
  <main class="wrap">

    <!-- Main intro -->
    <section class="card">
      <div class="cardHeader">
        <h1>GradeGuru</h1>
        <p
          A Flask + Machine Learning web app that predicts a student’s final grade (G3) and assigns a risk band.
          Use <b>Early</b> mode for early-warning, or <b>Full</b> mode when you also know <b>G1</b> and <b>G2</b>.
        </p>
      </div>

      <div class="cardBody">
        <div class="badgeRow">
          <span class="badge"><span class="dot"></span> Flask API</span>
          <span class="badge"><span class="dot"></span> UCI Student Performance</span>
          <span class="badge"><span class="dot"></span> Early vs Full Model</span>
        </div>

        <div class="ctaRow">
          <a class="btn" href="/dashboard" aria-label="Go to Dashboard">
            ▶ Start Prediction
          </a>

          <a class="btn btnGhost" href="/api/schema" target="_blank" rel="noreferrer">
            View API Schema
          </a>

          <a class="btn btnGhost" href="/api/health" target="_blank" rel="noreferrer">
            Health Check
          </a>
        </div>

        <div class="mini">
          Tip: If the dashboard says “Missing required features”, open
          <a class="link" href="/api/schema" target="_blank" rel="noreferrer">/api/schema</a>
          to see exactly what the model expects.
        </div>
      </div>
    </section>

  </main>

  <script>
    // Small interactive touch: auto-check health and show status.
    const log = document.getElementById("statusLog");

    async function checkHealth(){
      try{
        const res = await fetch("/api/health");
        const json = await res.json();
        log.textContent = "API Health:\n" + JSON.stringify(json, null, 2) + "\n\nNext:\nOpen /dashboard to run predictions.";
      }catch(e){
        log.textContent = "API Health: FAILED\n\nMake sure Flask is running.\nError:\n" + String(e);
      }
    }
    checkHealth();
  </script>
</body>
</html>
